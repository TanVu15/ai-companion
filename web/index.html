<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bơ</title>
<style>
  :root {
    --bg: #f6f3ee; --panel: #ffffff; --text: #1f1d1a; --muted: #77726a;
    --me: #2f6f5e; --me-text: #ffffff; --bot: #ece7df; --face: #ffd36e; --ink: #2b2620;
    --border: #e2dcd2;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #171614; --panel: #22201d; --text: #ece8e1; --muted: #9a948a;
      --me: #3c8a75; --bot: #2e2b27; --face: #f2c14e; --ink: #1d1a16; --border: #34302b; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .app { max-width: 640px; margin: 0 auto; height: 100%; display: flex; flex-direction: column; }
  header { display: flex; flex-direction: column; align-items: center; padding: 16px 16px 8px; }
  .face { width: 120px; height: 120px; border-radius: 50%; background: var(--face); position: relative;
    transition: transform .3s; }
  .eye { position: absolute; top: 40px; width: 14px; height: 18px; background: var(--ink); border-radius: 50%;
    transition: all .25s; animation: blink 4s infinite; }
  .eye.l { left: 34px; } .eye.r { right: 34px; }
  .mouth { position: absolute; left: 50%; top: 72px; width: 40px; height: 18px; transform: translateX(-50%);
    border: 4px solid var(--ink); border-top: none; border-radius: 0 0 40px 40px; transition: all .25s; }
  @keyframes blink { 0%, 96%, 100% { transform: scaleY(1); } 98% { transform: scaleY(.1); } }
  .face[data-e="hao_hung"] .mouth { height: 24px; width: 48px; background: var(--ink); }
  .face[data-e="vui"] .eye { height: 10px; top: 44px; border-radius: 10px 10px 0 0; }
  .face[data-e="buon"] .mouth { top: 80px; border: 4px solid var(--ink); border-bottom: none; border-radius: 40px 40px 0 0; }
  .face[data-e="buon"] .eye { top: 46px; height: 12px; }
  .face[data-e="ngac_nhien"] .mouth { width: 22px; height: 22px; border: 4px solid var(--ink); border-radius: 50%; }
  .face[data-e="ngac_nhien"] .eye { height: 22px; width: 18px; }
  .face[data-e="suy_nghi"] .mouth { height: 0; width: 28px; border-radius: 0; border-width: 0 0 4px 0; margin-left: 8px; }
  .face[data-e="suy_nghi"] .eye { top: 34px; }
  .face[data-e="thuong"] .eye { height: 10px; top: 44px; border-radius: 10px 10px 0 0; }
  .face[data-e="thuong"]::after { content: ""; position: absolute; left: 18px; right: 18px; top: 62px; height: 10px;
    background: radial-gradient(circle at 10px 5px, #f39a9a 6px, transparent 7px), radial-gradient(circle at calc(100% - 10px) 5px, #f39a9a 6px, transparent 7px); }
  @media (prefers-reduced-motion: no-preference) {
    .face.a-gat_dau { animation: nod .6s 2; } .face.a-lac_dau { animation: shake .5s 2; }
    .face.a-nhay { animation: jump .5s 2; } .face.a-nghieng_dau { transform: rotate(-12deg); }
    .face.a-vay_tay { animation: wave .4s 3; }
  }
  @keyframes nod { 50% { transform: translateY(8px); } }
  @keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  @keyframes jump { 50% { transform: translateY(-16px); } }
  @keyframes wave { 25% { transform: rotate(8deg); } 75% { transform: rotate(-8deg); } }
  .name { margin-top: 8px; font-weight: 600; } .status { font-size: 13px; color: var(--muted); min-height: 20px; }
  main { flex: 1; overflow-y: auto; padding: 8px 16px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 82%; padding: 8px 12px; border-radius: 16px; white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: var(--me); color: var(--me-text); border-bottom-right-radius: 4px; }
  .msg.assistant { align-self: flex-start; background: var(--bot); border-bottom-left-radius: 4px; }
  .msg .time { display: block; font-size: 11px; opacity: .6; margin-top: 2px; text-align: right; }
  .msg.error { align-self: center; color: #c0392b; font-size: 14px; background: none; }
  .msg.error .retry { margin-left: 8px; border: 1px solid #c0392b; color: #c0392b; background: #fff; border-radius: 12px; padding: 2px 10px; cursor: pointer; }
  form { display: flex; gap: 8px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--border); background: var(--panel); }
  textarea { flex: 1; resize: none; border: 1px solid var(--border); border-radius: 20px; padding: 10px 14px;
    font: inherit; background: var(--bg); color: var(--text); max-height: 120px; }
  button { border: none; border-radius: 20px; padding: 0 18px; background: var(--me); color: var(--me-text); font: inherit; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .link { background: none; color: var(--muted); font-size: 13px; padding: 2px 8px; text-decoration: underline; font-weight: 400; }
  dialog { border: 1px solid var(--border); border-radius: 16px; background: var(--panel); color: var(--text);
    width: min(480px, calc(100% - 32px)); max-height: 80vh; padding: 16px; }
  dialog::backdrop { background: rgba(0,0,0,.4); }
  dialog h2 { margin: 0 0 4px; font-size: 18px; } dialog p { margin: 0 0 12px; color: var(--muted); font-size: 14px; }
  #facts { list-style: none; margin: 0 0 12px; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  #facts li { display: flex; gap: 8px; align-items: center; background: var(--bg); border-radius: 10px; padding: 6px 6px 6px 12px; }
  #facts li span { flex: 1; } #facts li button { background: none; color: #c0392b; padding: 4px 10px; font-weight: 400; }
  .mic { padding: 0 14px; background: var(--bot); color: var(--text); display: flex; align-items: center; }
  .mic svg { width: 20px; height: 20px; fill: currentColor; }
  .mic.on { background: #c0392b; color: #fff; }
  @media (prefers-reduced-motion: no-preference) {
    .mic.on { animation: pulse 1.2s infinite; }
    .face.talking .mouth { animation: talk .25s infinite alternate; }
  }
  @keyframes pulse { 50% { opacity: .6; } }
  @keyframes talk { to { height: 6px; } }
  ul.plain { list-style: none; padding: 0; margin: 0 0 12px; } ul.plain li { padding: 4px 0; border-bottom: 1px solid var(--border); }
  .row { display: flex; justify-content: space-between; } .row button { padding: 8px 18px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="face" id="face" data-e="binh_thuong" aria-label="Khuôn mặt của Bơ" role="img">
      <div class="eye l"></div><div class="eye r"></div><div class="mouth"></div>
    </div>
    <div class="name">Bơ</div>
    <div class="status" id="status"></div>
    <div>
      <button class="link" id="openMem" type="button">Bơ nhớ gì về mình?</button>
      <button class="link" id="openCost" type="button">Chi phí</button>
      <button class="link" id="voiceBtn" type="button" aria-pressed="false">Giọng nói: tắt</button>
      <button class="link" id="rateBtn" type="button" hidden>Tốc độ đọc: vừa</button>
      <button class="link" id="handsBtn" type="button" aria-pressed="false" hidden>Rảnh tay: tắt</button>
    </div>
  </header>
  <main id="log" aria-live="polite"></main>
  <form id="form">
    <textarea id="input" rows="1" placeholder="Nhắn gì đó..." autocomplete="off"></textarea>
    <button id="mic" class="mic" type="button" hidden aria-label="Nói với Bơ" title="Bấm để nói">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
    </button>
    <button id="send" type="submit">Gửi</button>
  </form>
</div>
<dialog id="mem">
  <h2>Bơ nhớ gì về bạn</h2>
  <p>Xóa những điều sai hoặc bạn không muốn Bơ nhớ nữa.</p>
  <ul id="facts"></ul>
  <p>
    <a class="link" href="/api/sao-luu" download>Tải bản sao lưu</a>
    <label class="link" for="restoreFile" style="cursor:pointer">Nạp bản sao lưu</label>
    <input id="restoreFile" type="file" accept=".json,application/json" hidden>
  </p>
  <div class="row">
    <button class="link" id="clearMem" type="button">Xóa hết</button>
    <button id="closeMem" type="button">Xong</button>
  </div>
</dialog>
<dialog id="cost">
  <h2>Chi phí API</h2>
  <p>Ước tính theo giá đặt trong .env (PRICE_INPUT_PER_MTOK, PRICE_OUTPUT_PER_MTOK). Số tiền thật xem ở trang console của Anthropic.</p>
  <ul id="costList" class="plain"></ul>
  <div class="row"><span></span><button id="closeCost" type="button">Xong</button></div>
</dialog>
<script src="/web/danh_thuc.js"></script>
<script src="/web/doc_to.js"></script>
<script>
const log = document.getElementById('log'), form = document.getElementById('form');
const input = document.getElementById('input'), send = document.getElementById('send');
const face = document.getElementById('face'), statusEl = document.getElementById('status');

function timeLabel(t) {
  // t dạng "YYYY-MM-DD HH:MM:SS" (giờ máy chủ); không có thì là bây giờ
  const d = t ? new Date(t.replace(' ', 'T')) : new Date();
  if (isNaN(d)) return '';
  const hm = d.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const days = Math.round((today - new Date(d).setHours(0, 0, 0, 0)) / 86400000);
  return days <= 0 ? hm : days === 1 ? 'hôm qua ' + hm : d.toLocaleDateString('vi-VN') + ' ' + hm;
}
function makeMsg(role, text, t) {
  const d = document.createElement('div');
  d.className = 'msg ' + role; d.textContent = text;
  if (role !== 'error') {
    const s = document.createElement('span'); s.className = 'time'; s.textContent = timeLabel(t);
    d.appendChild(s);
  }
  return d;
}
function add(role, text, t) {
  log.appendChild(makeMsg(role, text, t)); log.scrollTop = log.scrollHeight;
}
function express(emotion, action) {
  face.dataset.e = emotion || 'binh_thuong';
  face.className = 'face';
  void face.offsetWidth;
  if (action && action !== 'khong') face.classList.add('a-' + action);
}
let oldestId = null, noMore = false, loadingOld = false;
async function loadHistory() {
  try {
    const r = await fetch('/api/history');
    if (!r.ok) return;
    const list = await r.json();
    list.forEach(m => add(m.role, m.content, m.created_at));
    if (list.length) oldestId = list[0].id; else noMore = true;
    if (list.length < 50) noMore = true;
  } catch (e) {}
}
async function loadOlder() {
  if (noMore || loadingOld || oldestId === null) return;
  loadingOld = true;
  try {
    const r = await fetch('/api/history?before_id=' + oldestId);
    const list = r.ok ? await r.json() : [];
    if (list.length < 50) noMore = true;
    if (list.length) {
      oldestId = list[0].id;
      const before = log.scrollHeight, frag = document.createDocumentFragment();
      list.forEach(m => frag.appendChild(makeMsg(m.role, m.content, m.created_at)));
      log.prepend(frag);
      log.scrollTop += log.scrollHeight - before;  // giữ nguyên chỗ đang đọc
    }
  } catch (e) {}
  loadingOld = false;
}
log.addEventListener('scroll', () => { if (log.scrollTop < 40) loadOlder(); });
function addError(text, retry) {
  add('error', text);
  if (!retry) return;
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'retry'; b.textContent = 'Thử lại';
  b.onclick = () => { b.closest('.msg').remove(); retry(); };
  log.lastChild.appendChild(b);
}
async function sendText(text) {
  send.disabled = true;
  statusEl.textContent = 'Bơ đang nghĩ...'; express('suy_nghi');
  const ctrl = new AbortController(), timer = setTimeout(() => ctrl.abort(), 150000);
  try {
    const r = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text }), signal: ctrl.signal });
    let data = {};
    try { data = await r.json(); } catch (e) {}
    if (!r.ok) throw new Error(data.detail || 'Máy chủ trả lỗi ' + r.status);
    add('assistant', data.noi); express(data.cam_xuc, data.hanh_dong); speak(data.noi);
  } catch (e) {
    const msg = e.name === 'AbortError' ? 'Bơ nghĩ lâu quá, thử lại nha.'
      : e instanceof TypeError ? 'Không kết nối được máy chủ. Máy chủ còn chạy không?' : e.message;
    addError(msg, () => sendText(text)); express('buon');
  } finally {
    clearTimeout(timer);
    send.disabled = false; statusEl.textContent = ''; input.focus();
    if (handsFree) resumeListening();
  }
}
form.addEventListener('submit', (ev) => {
  ev.preventDefault();
  const text = input.value.trim();
  if (!text || send.disabled) return;
  add('user', text); input.value = '';
  sendText(text);
});
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
});
// ---- Giọng nói: dùng sẵn của trình duyệt (miễn phí, không cần tài khoản) ----
let voiceOn = false, speaking = false;
try { voiceOn = localStorage.getItem('bo_voice') === '1'; } catch (e) {}
const voiceBtn = document.getElementById('voiceBtn'), micBtn = document.getElementById('mic');
const RATES = [['vừa', 1], ['nhanh', 1.25], ['chậm', 0.8]];
let rateIdx = 0;
try { rateIdx = Math.max(0, RATES.findIndex(r => r[0] === localStorage.getItem('bo_rate'))); } catch (e) {}
const rateBtn = document.getElementById('rateBtn');
function showVoice() {
  voiceBtn.textContent = 'Giọng nói: ' + (voiceOn ? 'bật' : 'tắt'); voiceBtn.setAttribute('aria-pressed', voiceOn);
  rateBtn.hidden = !voiceOn; rateBtn.textContent = 'Tốc độ đọc: ' + RATES[rateIdx][0];
}
rateBtn.onclick = () => {
  rateIdx = (rateIdx + 1) % RATES.length; showVoice();
  try { localStorage.setItem('bo_rate', RATES[rateIdx][0]); } catch (e) {}
  speak('Bơ đọc ' + RATES[rateIdx][0] + ' như này nha');
};
showVoice();
voiceBtn.onclick = () => {
  voiceOn = !voiceOn; showVoice();
  try { localStorage.setItem('bo_voice', voiceOn ? '1' : '0'); } catch (e) {}
  if (!voiceOn && window.speechSynthesis) { speechSynthesis.cancel(); speaking = false; face.classList.remove('talking'); }
};
function viVoice() {
  const all = window.speechSynthesis ? speechSynthesis.getVoices() : [];
  return all.find(v => v.lang && v.lang.toLowerCase().startsWith('vi')) || null;
}
function speak(text) {
  text = boChuDeDoc(text);
  if (!voiceOn || !window.speechSynthesis || !text) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'vi-VN'; u.rate = RATES[rateIdx][1]; const v = viVoice(); if (v) u.voice = v;
  u.onstart = () => face.classList.add('talking');
  u.onend = u.onerror = () => { speaking = false; face.classList.remove('talking'); resumeListening(); };
  speaking = true; speechSynthesis.speak(u);
  // Phòng khi trình duyệt quên báo "đọc xong" → rảnh tay không bị kẹt
  setTimeout(() => { if (speaking) u.onend(); }, 3000 + text.length * 150);
}
const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
const handsBtn = document.getElementById('handsBtn');
let rec = null, listening = false, handsFree = false, paused = false, awaitUntil = 0;
function startRec() {
  if (!rec || listening) return;
  rec.continuous = handsFree; rec.interimResults = !handsFree;
  try { rec.start(); listening = true; } catch (e) {}
}
function showHands() {
  handsBtn.textContent = 'Rảnh tay: ' + (handsFree ? 'bật' : 'tắt'); handsBtn.setAttribute('aria-pressed', handsFree);
  statusEl.textContent = handsFree ? 'Gọi "Bơ ơi" để nói chuyện' : '';
}
// Đang gửi tin hoặc Bơ đang nói thì tạm ngừng nghe (để Bơ không tự nghe giọng mình)
function pauseListening() { paused = true; if (rec && listening) rec.abort(); }
function resumeListening() {
  if (!handsFree || !paused || speaking || send.disabled) return;
  paused = false; statusEl.textContent = 'Gọi "Bơ ơi" để nói chuyện'; startRec();
}
function handsHeard(text) {
  let cmd = Date.now() < awaitUntil ? text.trim() : boDanhThuc(text);
  if (cmd === null || send.disabled) return;
  if (cmd === '') { awaitUntil = Date.now() + 8000; express('ngac_nhien'); statusEl.textContent = 'Bơ nghe nè...'; return; }
  awaitUntil = 0; input.value = cmd; pauseListening(); form.requestSubmit();
}
if (Rec && window.isSecureContext) {
  micBtn.hidden = false; handsBtn.hidden = false;
  rec = new Rec(); rec.lang = 'vi-VN';
  rec.onresult = (ev) => {
    if (handsFree) {
      for (let i = ev.resultIndex; i < ev.results.length; i++)
        if (ev.results[i].isFinal) handsHeard(ev.results[i][0].transcript);
    } else {
      input.value = Array.from(ev.results).map(r => r[0].transcript).join('');
    }
  };
  rec.onend = () => {
    listening = false; micBtn.classList.remove('on');
    if (handsFree) { if (!paused) setTimeout(startRec, 300); return; }  // máy tự ngắt sau một lúc → nghe lại
    statusEl.textContent = '';
    if (input.value.trim() && !send.disabled) form.requestSubmit();
  };
  rec.onerror = (ev) => {
    if (ev.error === 'not-allowed') {
      handsFree = false; showHands();
      addError('Trình duyệt chưa cho dùng micro. Bấm vào biểu tượng ổ khóa trên thanh địa chỉ để cho phép.');
    } else if (!['no-speech', 'aborted', 'network'].includes(ev.error)) addError('Không nghe được: ' + ev.error);
  };
  micBtn.onclick = () => {
    if (handsFree) return;
    if (listening) { rec.stop(); return; }
    if (window.speechSynthesis) speechSynthesis.cancel();
    input.value = ''; micBtn.classList.add('on'); statusEl.textContent = 'Bơ đang nghe...';
    startRec();
  };
  handsBtn.onclick = () => {
    handsFree = !handsFree; paused = false; awaitUntil = 0; showHands();
    micBtn.disabled = handsFree;
    if (listening) rec.abort(); else if (handsFree) startRec();
  };
}

const costDlg = document.getElementById('cost'), costList = document.getElementById('costList');
function money(usd) { return '$' + usd.toFixed(usd < 1 ? 4 : 2) + ' (~' + Math.round(usd * 25000).toLocaleString('vi-VN') + 'đ)'; }
document.getElementById('openCost').onclick = async () => {
  costList.innerHTML = '<li>Đang tải...</li>'; costDlg.showModal();
  try {
    const d = await (await fetch('/api/chi-phi')).json();
    const rows = [
      ['Hôm nay', d.hom_nay.calls + ' câu gọi API, ' + money(d.hom_nay.usd)],
      ['Tháng này', d.thang_nay.calls + ' câu gọi API, ' + money(d.thang_nay.usd)],
      ['Bơ đã trả lời hôm nay', d.da_tra_loi_hom_nay + ' / ' + d.gioi_han_ngay + ' câu (giới hạn ngày)'],
      ['Ngân sách tháng', d.ngan_sach_thang > 0
        ? money(d.ngan_sach_thang) + ' — đã dùng ' + Math.min(100, Math.round(d.thang_nay.usd / d.ngan_sach_thang * 100)) + '%'
        : 'không giới hạn (đặt MONTHLY_USD_LIMIT trong .env)'],
    ];
    costList.innerHTML = '';
    rows.forEach(([k, v]) => { const li = document.createElement('li'); li.textContent = k + ': ' + v; costList.appendChild(li); });
  } catch (e) { costList.innerHTML = '<li>Không tải được.</li>'; }
};
document.getElementById('closeCost').onclick = () => costDlg.close();

async function greet() {
  try {
    const r = await fetch('/api/chao', { method: 'POST' });
    const data = await r.json();
    if (r.ok && data.noi) { add('assistant', data.noi); express(data.cam_xuc, data.hanh_dong); speak(data.noi); }
  } catch (e) {}
}
loadHistory().then(greet);

const mem = document.getElementById('mem'), factsEl = document.getElementById('facts');
async function delFact(content) {
  await fetch('/api/facts', { method: 'DELETE', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ content }) });
}
async function loadFacts() {
  factsEl.innerHTML = '';
  let list = [];
  try { const r = await fetch('/api/facts'); if (r.ok) list = await r.json(); } catch (e) {}
  if (!list.length) { const li = document.createElement('li'); li.textContent = 'Bơ chưa nhớ gì cả.'; factsEl.appendChild(li); }
  list.forEach(f => {
    const li = document.createElement('li'), span = document.createElement('span'), b = document.createElement('button');
    span.textContent = f; b.textContent = 'Xóa'; b.type = 'button';
    b.setAttribute('aria-label', 'Xóa: ' + f);
    b.onclick = async () => { await delFact(f); loadFacts(); };
    li.append(span, b); factsEl.appendChild(li);
  });
}
document.getElementById('openMem').onclick = () => { loadFacts(); mem.showModal(); };
document.getElementById('closeMem').onclick = () => mem.close();
document.getElementById('restoreFile').onchange = async (ev) => {
  const file = ev.target.files[0]; ev.target.value = '';
  if (!file || !confirm('Nạp bản sao lưu sẽ THAY toàn bộ trí nhớ và tin nhắn hiện tại. Tiếp tục?')) return;
  try {
    const r = await fetch('/api/khoi-phuc', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: await file.text() });
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || 'Lỗi');
    alert('Đã nạp xong!'); location.reload();
  } catch (e) { alert('Không nạp được: ' + e.message); }
};
document.getElementById('clearMem').onclick = async () => {
